# Upptime config for Indexfolio platform uptime.
# Lives in the PUBLIC repo aravindasiva/indexfolio-status - only public URLs, never engine endpoints.

owner: aravindasiva
repo: indexfolio-status

sites:
  - name: Website
    url: https://www.indexfolio.dev
  - name: API
    url: https://api.indexfolio.dev/health-broken

# Incident Issues are assigned to you.
assignees:
  - aravindasiva

# DOWN/UP posts go to the #platform-alerts webhook stored as a repo secret.
notifications:
  - type: discord
    webhook: '$NOTIFICATION_DISCORD_WEBHOOK_URL'

status-website:
  logoUrl: https://www.indexfolio.dev/indexfolio.svg
  name: Indexfolio Status
  introTitle: '**Indexfolio** status'
  introMessage: Live status of the Indexfolio website and API.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/aravindasiva/indexfolio-status
  # Optional custom domain - needs a CNAME record status.indexfolio.dev -> aravindasiva.github.io
  # cname: status.indexfolio.dev

# Incidents shorter than 15 min are auto-deleted to suppress transient blips.
